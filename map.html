<!DOCTYPE html>
<html lang="fr">
<!--
  MAP.HTML — EDUQUEST v1.29.1
  Carte interactive : progression niveau par niveau (1 à 100), personnage, chronomètre et quiz adaptatif par filière.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore les îles du savoir — EDUQUEST</title>
    <meta name="description" content="Gravis les 36 îles-matières niveau par niveau : chaque victoire rapporte XP, pièces et badges.">
    <meta name="theme-color" content="#0d1330">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EDUQUEST">
    <meta property="og:title" content="Explore les îles du savoir — EDUQUEST">
    <meta property="og:description" content="100 niveaux par matière sur une carte d'aventure. Apprends en progressant !">
    <meta property="og:image" content="Image/logo.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/webp" href="Image/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quests.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <!-- Fond animé (même que toutes les autres pages) -->
    <div class="background"></div>
    <!-- ID différent de 'stars' : map.html utilise 'stars-bg' -->
    <!-- createEnvironment() cherche getElementById('stars') OU getElementById('stars-bg') -->
    <div id="stars-bg" class="stars"></div>
    <div id="clouds" class="clouds"></div>

    <!-- Zone principale : s'étend sur toute la hauteur de l'écran -->
    <main class="subject-page">

        <!-- ================================================================
             EN-TÊTE DE LA CARTE (.map-header)
             Positionnée en overlay sur la carte (position: fixed/absolute dans CSS).
             Contient le nom et l'icône de la matière + boutons de navigation.
             Les valeurs de .subject-icon et <h1> sont injectées par JS (initMap).
        ================================================================ -->
        <section class="map-header" aria-label="Carte des niveaux">
            <!-- Côté gauche : icône, titre de la matière et badge classe en lecture seule -->
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <span class="subject-icon">📚</span>
                <h1>Matière</h1>
                <span class="map-grade-badge" id="mapGradeBadge" title="Ta classe actuelle (modifiable depuis le tableau de bord ou les options)">🎓 6ème</span>
            </div>
            <!-- Côté droit : boutons d'action -->
            <div style="display: flex; gap: 10px; align-items: center; pointer-events: auto;">
                <button id="mapSkinBtn" class="map-skin-btn" type="button" title="Changer de personnage sur la carte" aria-label="Changer de personnage" aria-haspopup="dialog" aria-expanded="false">👤</button>
                <a class="options-wheel" href="index.html#options" title="Options">⚙️</a>
                <a class="back-button" href="dashboard.html">← RETOUR</a>
            </div>
        </section>

        <!-- ================================================================
             CARTE DES NIVEAUX (.level-map)
             Zone principale contenant le chemin SVG et les boutons de niveau.
             Le fond de la carte est défini par le style CSS .level-map
             (image de fond ou dégradé dans style.css).
        ================================================================ -->
        <section class="level-map" id="level-map-viewport" aria-label="Chemin des niveaux">

            <!-- Illustration de l'îlot de la matière en arrière-plan, discrète.
                 src injecté par JS (initMap) à partir de l'icône canonique de la
                 matière — renforce l'identité visuelle avec dashboard.html.
                 aria-hidden : purement décoratif. -->
            <img id="subject-bg-island" class="subject-bg-island" alt="" aria-hidden="true" decoding="async">

            <!-- ============================================================
                 PISTE DE NIVEAUX (v2.3 — jusqu'à 100 niveaux par matière)
                 Conteneur haut et défilant (voir #level-map-viewport, qui
                 porte overflow-y:auto). Tout son contenu — chemin SVG,
                 personnage, boutons de niveau — est généré par JS
                 (buildLevelTrack dans app.js → initMap), car coder 100
                 boutons en dur ici serait ingérable.

                 Le niveau 1 est en bas de la piste, le niveau 100 en haut
                 (on "gravit" la matière) ; la page se scrolle automatiquement
                 jusqu'au niveau courant à l'ouverture.

                 États gérés par JS (renderLevels dans app.js), inchangés :
                   .locked / .active / .completed / (aucune classe = débloqué)
            ============================================================ -->
            <div id="level-track" class="level-track"></div>

        </section><!-- fin .level-map -->
    </main>

    <!-- ================================================================
         MODALE DE RÉSULTAT DE NIVEAU (#level-modal)
         Affichée quand le joueur clique sur un niveau non verrouillé.
         Cachée par défaut (attribut HTML5 'hidden').

         Quand la matière est reconnue (voir MATIERE_TO_SUBJECT_ID dans
         app.js → initMap — les 36 matières officielles + matières custom),
         cette modale affiche une vraie question via QuizEngine. Le choix
         d'étoiles reste un repli pour une matière personnalisée sans leçon.

         COMPOSANTS :
           #modal-title       → "Niveau N" (mis à jour par JS au clic)
           #modal-quiz-zone   → mode quiz réel (question + réponses + actions)
           #modal-stars-zone  → mode étoiles (repli, matière sans leçon)
           #modal-close       → annule sans sauvegarder (mode étoiles)
           #reset-progress    → remet la progression de la matière à zéro
    ================================================================ -->
    <div id="level-modal" class="modal-overlay" hidden>
        <div class="modal">
            <!-- Titre mis à jour par JS : modal-title.textContent = 'Niveau ' + currentModalLevel -->
            <h2 id="modal-title">Niveau 1</h2>

            <!-- ============================================================
                 MODE QUIZ RÉEL (v2.1+)
                 Utilisé pour toutes les matières officielles et personnalisées
                 avec leçons. Rempli dynamiquement par QuizEngine — mêmes
                 classes .dash-* que le quiz du dashboard.
            ============================================================ -->
            <div id="modal-quiz-zone" hidden>
                <div id="modal-quiz-meta" class="quiz-meta-strip"></div>
                <p id="modal-quiz-question" class="modal-subtitle"></p>
                <div id="modal-quiz-hint-slot"></div>
                <div id="modal-quiz-body" class="dash-quiz-body"></div>
                <div id="modal-quiz-feedback"></div>
                <div id="modal-quiz-actions" class="dash-modal-actions"></div>
            </div>

            <!-- ============================================================
                 MODE ÉTOILES (repli)
                 Conservé comme repli si une matière personnalisée créée par
                 un enseignant n'a pas encore de leçon enregistrée.
            ============================================================ -->
            <div id="modal-stars-zone">
                <p class="modal-subtitle">Choisissez votre résultat :</p>
                <div class="modal-stars-choice">
                    <button class="star-choice" data-stars="1" type="button">
                        <span>⭐</span>
                        <span class="star-label">1 étoile</span>
                    </button>
                    <button class="star-choice" data-stars="2" type="button">
                        <span>⭐⭐</span>
                        <span class="star-label">2 étoiles</span>
                    </button>
                    <button class="star-choice" data-stars="3" type="button">
                        <span>⭐⭐⭐</span>
                        <span class="star-label">3 étoiles</span>
                    </button>
                </div>
                <!-- Bouton Annuler : ferme la modale sans modifier la progression -->
                <button id="modal-close" class="modal-close-btn" type="button">Annuler</button>
            </div>

            <!-- Bouton Réinitialiser : remet toute la progression de la matière à zéro -->
            <!-- Utile pour les tests ou si le joueur veut recommencer depuis le début -->
            <button id="reset-progress" class="modal-reset-btn" type="button">🔄 Réinitialiser la progression</button>
        </div>
    </div>

    <!-- Overlay de transition dynamique d'expulsion si la matière ne correspond pas à la classe -->
    <div id="mapExpelOverlay" class="map-expel-overlay" role="alertdialog" aria-modal="true" hidden>
        <div class="map-expel-card">
            <div class="map-expel-icon">🧭</div>
            <h2 class="map-expel-title" id="mapExpelTitle">Changement de parcours</h2>
            <p class="map-expel-text" id="mapExpelText">Cette matière ne fait pas partie du programme de ta classe actuelle. Retour au tableau de bord…</p>
            <div class="map-expel-bar"><div class="map-expel-bar-fill"></div></div>
        </div>
    </div>

    <!-- Sélecteur rapide de personnage sur la carte -->
    <div id="mapSkinPopover" class="map-skin-popover" role="dialog" aria-label="Choisir ton personnage sur la carte" hidden>
        <div class="map-skin-popover-head">
            <span class="map-skin-popover-title">👤 Personnage</span>
            <button id="mapSkinClose" class="map-skin-popover-close" type="button" aria-label="Fermer">✕</button>
        </div>
        <div id="mapSkinGrid" class="map-skin-grid"></div>
        <div class="map-skin-popover-foot">
            <a href="dashboard.html#boutique-avatars" class="map-skin-shop-link">🛍️ Débloquer plus d'avatars →</a>
        </div>
    </div>

    <footer>
        <div class="footer">Version 1.29.1</div>
        <div class="legal-links"><a href="legal.html">Mentions légales</a> · <a href="legal.html#cookies" onclick="window.dispatchEvent(new Event('eduquest:cookie-reopen'))">Cookies</a></div>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/admin-store.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/question-bank.js"></script>
    <script src="js/core/audio-manager.js"></script>
    <script src="js/core/quiz-timer.js"></script>
    <script src="js/core/adaptive-engine.js"></script>
    <script src="js/ai-provider.js"></script>
    <script src="js/core/game-rules.js"></script>
    <script src="js/core/quiz-session.js"></script>
    <script src="js/features/daily-quests.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cookies.js"></script>
</body>
</html>

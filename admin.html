<!DOCTYPE html>
<html lang="fr">
<!--
  ADMIN.HTML — EDUQUEST v1.20
  Panneau d'administration : gérer membres, niveaux scolaires, matières,
  crédits et contenus (leçons) SANS toucher au code.

  ACCÈS :
    Accès DIRECT : le panneau s'ouvre sans mot de passe dès qu'on ouvre
    admin.html ou qu'on clique sur « 🔐 Administration » dans index.html.
    (Une page de connexion par rôle 'admin' existe dans admin.js mais est
    désactivée pour l'instant — à réactiver avant toute mise en ligne.)

  CONTENU :
    - Niveaux scolaires  → liste des classes (6ème → Terminale par défaut),
                           ajout / renommage / suppression / bande collège-lycée.
    - Matières & leçons  → renommer ou changer l'icône d'une matière, créer
                           des matières personnalisées, éditer les leçons
                           (5 types de questions), ajouter / supprimer /
                           réordonner des niveaux.
    - Membres            → comptes locaux : création, pseudo, mot de passe,
                           rôle (élève / administrateur), suppression.
    - Crédits            → nom du créateur / studio, site, contact : affichés
                           dans le pied de page du jeu et la page légale.
    - Réglages           → export/import de la configuration, reset, infos d'accès.

  PERSISTANCE (mode local) :
    La configuration administrateur est stockée dans localStorage
    (clé 'eduquest_admin_data', via admin-store.js). Les comptes membres sont
    ceux du jeu (db.js → 'eduquest_local_users'). En mode API SQL
    (API_URL décommentée dans db.js), la gestion des membres se fait côté
    backend : le panneau affiche alors un avertissement.

  SCRIPTS (ordre important) :
    db.js → question-bank.js → admin-store.js → app.js (enregistre les
    matières par défaut + construit DASH_SUBJECTS) → admin.js (interface).
    cookies.js (autonome) → bandeau de consentement RGPD.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUQUEST — Administration</title>
    <meta name="description" content="EDUQUEST — Panneau d'administration : membres, niveaux, matières et contenus.">
    <!-- v1.21 : PAS d'indexation (usage interne — voir robots.txt et bot.txt §4) -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="Image/logo.webp">
    <link rel="stylesheet" href="admin.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

    <!-- ================================================================
         BARRE SUPÉRIEURE
    ================================================================ -->
    <header class="adm-top">
        <div class="adm-brand">
            <span class="adm-logo">🛡️</span>
            <div>
                <h1>EDUQUEST</h1>
                <p>Panneau d'administration</p>
            </div>
        </div>
        <div class="adm-top-right">
            <span class="adm-mode" id="admMode"></span>
            <a class="adm-btn adm-btn-ghost" href="index.html" title="Revenir au jeu">← Retour au jeu</a>
        </div>
    </header>

    <!-- ================================================================
         CONTENU (rendu par admin.js)
    ================================================================ -->
    <main id="admApp" class="adm-main"></main>

    <!-- Notifications toast -->
    <div id="admToast" class="adm-toast" aria-live="polite"></div>

    <!-- ================================================================
         SCRIPTS
         db.js          → comptes membres locaux + données du jeu
         question-bank.js → requis par app.js (bandes de niveaux)
         admin-store.js → configuration niveaux/matières (avant app.js)
         app.js         → enregistre les matières par défaut (registerDefaults)
         admin.js       → interface du panneau (accès direct, sans connexion)
    ================================================================ -->
    <script src="db.js"></script>
    <script src="question-bank.js"></script>
    <script src="admin-store.js"></script>
    <script src="app.js"></script>
    <script src="admin.js"></script>
    <script src="cookies.js"></script>
</body>
</html>

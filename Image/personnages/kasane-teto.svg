<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#1b0e24"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- Twin Drill Tails (Gauche & Droite) -->
  <g fill="#e11d48" stroke="#881337" stroke-width="2">
    <polygon points="16,40 34,44 30,58 14,54"/>
    <polygon points="14,56 31,60 27,74 13,70"/>
    <polygon points="15,72 28,76 22,94 14,88"/>
    <polygon points="104,40 86,44 90,58 106,54"/>
    <polygon points="106,56 89,60 93,74 107,70"/>
    <polygon points="105,72 92,76 98,94 106,88"/>
  </g>
  <!-- Dark Gray Uniform with Pink/Red Trim -->
  <path d="M30 120 L36 86 L84 86 L90 120 Z" fill="#27272a" stroke="#e11d48" stroke-width="2.5"/>
  <!-- Red Tie -->
  <polygon points="60,86 55,108 60,115 65,108" fill="#e11d48"/>
  <!-- Head -->
  <rect x="40" y="38" width="40" height="42" rx="18" fill="#ffe5d9" stroke="#d4a373" stroke-width="2"/>

  <ellipse cx="50" cy="58" rx="4" ry="5" fill="#be123c"/>
  <ellipse cx="70" cy="58" rx="4" ry="5" fill="#be123c"/>
  <circle cx="49" cy="56" r="1.5" fill="#fff"/>
  <circle cx="69" cy="56" r="1.5" fill="#fff"/>
  <!-- Smile -->
  <path d="M55 70 Q60 75 65 70" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
  <!-- Hair Bangs & Ahoge -->
  <path d="M36 48 Q40 28 60 28 Q80 28 84 48 L78 52 L72 42 L64 52 L60 41 L54 52 L46 42 L40 52 Z" fill="#e11d48" stroke="#881337" stroke-width="2"/>
  <!-- Headset -->
  <rect x="34" y="52" width="6" height="12" rx="2" fill="#18181b" stroke="#00f5d4" stroke-width="1.5"/>
  <rect x="80" y="52" width="6" height="12" rx="2" fill="#18181b" stroke="#00f5d4" stroke-width="1.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="avrobotBg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#091126"/>
    </radialGradient>
    <linearGradient id="avrobotGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce9a6"/>
      <stop offset="100%" stop-color="#b88d32"/>
    </linearGradient>
    <clipPath id="avrobotClip"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="#091126"/>
  <g clip-path="url(#avrobotClip)">
    <rect width="120" height="120" fill="url(#avrobotBg)"/>
    <!-- Constellation astrale de fond -->
    <circle cx="60" cy="60" r="49" fill="none" stroke="url(#avrobotGold)" stroke-width="1" stroke-dasharray="4 5" opacity="0.35"/>
    <g fill="#f7e7ae" opacity="0.8">
      <path d="M22 26 l1.4 3.2 3.2 1.4 -3.2 1.4 -1.4 3.2 -1.4 -3.2 -3.2 -1.4 3.2 -1.4 Z"/>
      <circle cx="98" cy="28" r="1.8"/>
      <circle cx="18" cy="64" r="1.4" opacity="0.6"/>
      <circle cx="102" cy="58" r="1.6" opacity="0.7"/>
    </g>
    
    <!-- Antenne & Corps robot astral -->
    <line x1="60" y1="14" x2="60" y2="28" stroke="url(#avrobotGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="14" r="4.5" fill="#67e8f9" stroke="#0e172a" stroke-width="1.6"/>
    <path d="M26 118 L34 82 Q60 76 86 82 L94 118 Z" fill="#334e68" stroke="#0e172a" stroke-width="2"/>
    <rect x="46" y="88" width="28" height="16" rx="4" fill="#0f172a" stroke="url(#avrobotGold)" stroke-width="1.6"/>
    <circle cx="60" cy="96" r="4.5" fill="#38bdf8"/>
    <!-- Tête robot -->
    <rect x="33" y="28" width="54" height="46" rx="14" fill="#cbd5e1" stroke="#0e172a" stroke-width="2"/>
    <rect x="27" y="44" width="6" height="14" rx="3" fill="url(#avrobotGold)"/>
    <rect x="87" y="44" width="6" height="14" rx="3" fill="url(#avrobotGold)"/>
    <!-- Visière lumineuse -->
    <rect x="40" y="38" width="40" height="22" rx="8" fill="#091326" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="51" cy="49" r="4.2" fill="#67e8f9"/><circle cx="69" cy="49" r="4.2" fill="#67e8f9"/>
    <path d="M52 65 Q60 70 68 65" fill="none" stroke="#0e172a" stroke-width="2" stroke-linecap="round"/>
  
  </g>
  <!-- Cadre médaillon doré unifié -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#avrobotGold)" stroke-width="3.2"/>
</svg>

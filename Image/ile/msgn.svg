<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT MSGN MANAGEMENT ET GESTION - EDUQUEST -->
  <defs>
    <linearGradient id="mgRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a4b"/>
      <stop offset="0.6" stop-color="#0e2230"/>
      <stop offset="1" stop-color="#07121a"/>
    </linearGradient>
    <linearGradient id="mgRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5e75"/>
      <stop offset="0.6" stop-color="#1b3c4d"/>
      <stop offset="1" stop-color="#0f232e"/>
    </linearGradient>
    <linearGradient id="mgTower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="mgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="mgHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#eab308" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mgShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="mgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#mgHalo)"/>

  <!-- Base rocheuse flottante -->
  <g filter="url(#mgShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#mgRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#mgRockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="#0f2942"/>
    <ellipse cx="210" cy="242" rx="130" ry="34" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75"/>
  </g>

  <!-- Tours de siège social (Entreprise) -->
  <g filter="url(#mgShadow)">
    <rect x="130" y="138" width="58" height="104" rx="5" fill="url(#mgTower)" stroke="#93c5fd" stroke-width="2"/>
    <!-- Fenêtres -->
    <g fill="#dbeafe" opacity="0.85">
      <rect x="140" y="150" width="12" height="10" rx="1.5"/>
      <rect x="164" y="150" width="12" height="10" rx="1.5"/>
      <rect x="140" y="168" width="12" height="10" rx="1.5"/>
      <rect x="164" y="168" width="12" height="10" rx="1.5"/>
      <rect x="140" y="186" width="12" height="10" rx="1.5"/>
      <rect x="164" y="186" width="12" height="10" rx="1.5"/>
      <rect x="140" y="204" width="12" height="10" rx="1.5"/>
      <rect x="164" y="204" width="12" height="10" rx="1.5"/>
    </g>
    <rect x="150" y="222" width="18" height="20" rx="2" fill="#eab308"/>
  </g>

  <!-- Histogramme de performance 3D à droite -->
  <g filter="url(#mgShadow)">
    <rect x="206" y="204" width="22" height="38" rx="4" fill="#38bdf8"/>
    <rect x="236" y="178" width="22" height="64" rx="4" fill="#34d399"/>
    <rect x="266" y="148" width="22" height="94" rx="4" fill="url(#mgGold)"/>
  </g>

  <!-- Flèche stratégique montante -->
  <g filter="url(#mgGlow)">
    <path d="M 200 186 L 240 156 L 266 132 L 298 106" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="304,100 286,104 297,118" fill="#fef08a"/>
  </g>

  <!-- Diagramme circulaire SWOT flottant -->
  <g transform="translate(158, 102)" filter="url(#mgGlow)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#93c5fd" stroke-width="2"/>
    <path d="M 0 0 L 0 -22 A 22 22 0 0 1 22 0 Z" fill="#34d399"/>
    <path d="M 0 0 L 22 0 A 22 22 0 0 1 0 22 Z" fill="#eab308"/>
    <path d="M 0 0 L 0 22 A 22 22 0 0 1 -22 0 Z" fill="#38bdf8"/>
    <path d="M 0 0 L -22 0 A 22 22 0 0 1 0 -22 Z" fill="#f472b6"/>
  </g>
</svg>


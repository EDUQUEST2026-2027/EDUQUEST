<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="iartsHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iartsRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="iartsRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="iartsPlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2263"/>
      <stop offset="1" stop-color="#211038"/>
    </linearGradient>
    <linearGradient id="iartsGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="iartsAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="iartsBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="iartsShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#iartsHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#e9d5ff" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#e9d5ff" opacity="0.6"/>
  </g>

  <g filter="url(#iartsShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#iartsRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#iartsRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#e9d5ff" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#e9d5ff" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#iartsPlateau)" stroke="url(#iartsGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Palette d'artiste + Pinceau doré + Note de musique -->
      <g transform="translate(210 148)">
        <ellipse cx="0" cy="80" rx="80" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Palette -->
        <path d="M-66 12 C-68 -36 -18 -56 26 -42 C68 -28 74 14 48 34 C30 48 16 32 10 46 C4 62 -64 60 -66 12 Z"
              fill="#d9b27c" stroke="url(#iartsGold)" stroke-width="3.5"/>
        <circle cx="-36" cy="-10" r="10" fill="#ef4444"/><circle cx="-8" cy="-24" r="10" fill="#facc15"/>
        <circle cx="24" cy="-18" r="10" fill="#38bdf8"/><circle cx="38" cy="8" r="9" fill="#4ade80"/>
        <circle cx="-26" cy="24" r="11" fill="#211038" stroke="url(#iartsGold)" stroke-width="2"/>
        <!-- Pinceau diagonal -->
        <g transform="translate(12 -14) rotate(36)">
          <rect x="-5" y="-56" width="10" height="84" rx="4" fill="#1e293b" stroke="url(#iartsGold)" stroke-width="2"/>
          <path d="M-7 28 H7 L0 56 Z" fill="#c084fc"/>
        </g>
        <!-- Clé / Double croche dorée -->
        <g transform="translate(72 -38)">
          <path d="M-6 26 V-22 L20 -28 V18" stroke="url(#iartsGold)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <circle cx="-12" cy="28" r="8" fill="url(#iartsGold)"/>
          <circle cx="14" cy="20" r="8" fill="url(#iartsGold)"/>
        </g>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-90 -19 L90 -19 L78 19 L-78 19 Z"
            fill="url(#iartsBanner)" stroke="url(#iartsGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-74" cy="-9" r="2.4"/>
        <circle cx="74" cy="-9" r="2.4"/>
        <circle cx="-68" cy="10" r="2.4"/>
        <circle cx="68" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="24" font-weight="700"
            fill="#f4de94" letter-spacing="2">ARTS</text>
    </g>
  </g>
</svg>

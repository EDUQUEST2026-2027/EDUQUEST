<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="ianglaisHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ianglaisRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="ianglaisRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="ianglaisPlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243566"/>
      <stop offset="1" stop-color="#131d3d"/>
    </linearGradient>
    <linearGradient id="ianglaisGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="ianglaisAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ianglaisBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="ianglaisShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#ianglaisHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#fca5a5" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#fca5a5" opacity="0.6"/>
  </g>

  <g filter="url(#ianglaisShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#ianglaisRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#ianglaisRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#fca5a5" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#fca5a5" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#ianglaisPlateau)" stroke="url(#ianglaisGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Big Ben doré + Bouclier Union Jack + Bulle dialogue -->
      <g transform="translate(210 152)">
        <ellipse cx="0" cy="76" rx="78" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Tour Big Ben -->
        <g transform="translate(-32 0)">
          <rect x="-24" y="-36" width="48" height="106" fill="#d9c08c" stroke="#1e293b" stroke-width="2.5"/>
          <polygon points="-28,-36 0,-84 28,-36" fill="#1e3a5f" stroke="url(#ianglaisGold)" stroke-width="2.5"/>
          <circle cx="0" cy="-10" r="16" fill="#fffbeb" stroke="url(#ianglaisGold)" stroke-width="3"/>
          <path d="M0 -10 V-20 M0 -10 L8 -6" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <!-- Blason Union Jack stylisé -->
        <g transform="translate(48 16)">
          <path d="M0 -42 L38 -26 V10 C38 34 20 48 0 56 C-20 48 -38 34 -38 10 V-26 Z" fill="#1d4ed8" stroke="url(#ianglaisGold)" stroke-width="3.5"/>
          <path d="M-30 -20 L30 30 M30 -20 L-30 30" stroke="#ffffff" stroke-width="8"/>
          <path d="M-30 -20 L30 30 M30 -20 L-30 30" stroke="#ef4444" stroke-width="3.5"/>
          <path d="M0 -38 V52 M-35 5 H35" stroke="#ffffff" stroke-width="11"/>
          <path d="M0 -38 V52 M-35 5 H35" stroke="#ef4444" stroke-width="6"/>
        </g>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-90 -19 L90 -19 L78 19 L-78 19 Z"
            fill="url(#ianglaisBanner)" stroke="url(#ianglaisGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-74" cy="-9" r="2.4"/>
        <circle cx="74" cy="-9" r="2.4"/>
        <circle cx="-68" cy="10" r="2.4"/>
        <circle cx="68" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="700"
            fill="#f4de94" letter-spacing="2">ANGLAIS</text>
    </g>
  </g>
</svg>

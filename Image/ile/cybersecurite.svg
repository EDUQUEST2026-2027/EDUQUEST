<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="icybersecuriteHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icybersecuriteRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="icybersecuriteRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="icybersecuritePlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13433b"/>
      <stop offset="1" stop-color="#09221e"/>
    </linearGradient>
    <linearGradient id="icybersecuriteGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="icybersecuriteAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="icybersecuriteBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="icybersecuriteShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#icybersecuriteHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#6ee7b7" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#6ee7b7" opacity="0.6"/>
  </g>

  <g filter="url(#icybersecuriteShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#icybersecuriteRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#icybersecuriteRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#6ee7b7" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#icybersecuritePlateau)" stroke="url(#icybersecuriteGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Grand bouclier émeraude + Cadenas d'or + Anneaux pare-feu -->
      <g transform="translate(210 144)">
        <ellipse cx="0" cy="84" rx="74" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Bouclier -->
        <path d="M0 -64 L62 -38 V16 C62 52 34 74 0 86 C-34 74 -62 52 -62 16 V-38 Z" fill="url(#icybersecuriteAccent)" stroke="url(#icybersecuriteGold)" stroke-width="4"/>
        <path d="M0 -48 L48 -28 V14 C48 42 26 60 0 70 C-26 60 -48 42 -48 14 V-28 Z" fill="#0a2420" stroke="#6ee7b7" stroke-width="2"/>
        <!-- Cadenas doré -->
        <path d="M-16 6 V-10 A16 16 0 0 1 16 -10 V6" fill="none" stroke="url(#icybersecuriteGold)" stroke-width="7" stroke-linecap="round"/>
        <rect x="-26" y="4" width="52" height="38" rx="8" fill="url(#icybersecuriteGold)" stroke="#0c1830" stroke-width="2.5"/>
        <circle cx="0" cy="19" r="5" fill="#0a2420"/>
        <rect x="-2.5" y="21" width="5" height="11" rx="2" fill="#0a2420"/>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-90 -19 L90 -19 L78 19 L-78 19 Z"
            fill="url(#icybersecuriteBanner)" stroke="url(#icybersecuriteGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-74" cy="-9" r="2.4"/>
        <circle cx="74" cy="-9" r="2.4"/>
        <circle cx="-68" cy="10" r="2.4"/>
        <circle cx="68" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="23" font-weight="700"
            fill="#f4de94" letter-spacing="2">CYBER</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT CYBERSECURITE CIEL - EDUQUEST -->
  <defs>
    <linearGradient id="cyRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2e26"/>
      <stop offset="0.6" stop-color="#051a16"/>
      <stop offset="1" stop-color="#020c0a"/>
    </linearGradient>
    <linearGradient id="cyRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e4d"/>
      <stop offset="0.6" stop-color="#0d3b31"/>
      <stop offset="1" stop-color="#06211b"/>
    </linearGradient>
    <linearGradient id="cyShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="cyHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.58"/>
    </filter>
    <filter id="cyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#cyHalo)"/>

  <!-- Base rocheuse cyber-défense -->
  <g filter="url(#cyShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#cyRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#cyRockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="#06211b"/>
    <ellipse cx="210" cy="242" rx="132" ry="34" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#cyGlow)"/>
    <ellipse cx="210" cy="242" rx="92" ry="22" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>

  <!-- Grand Bouclier de Cybersécurité central -->
  <g filter="url(#cyShadow)">
    <path d="M 210 98 L 274 124 L 274 176 C 274 214 246 238 210 252 C 174 238 146 214 146 176 L 146 124 Z" fill="url(#cyShield)" stroke="#a7f3d0" stroke-width="3"/>
    <path d="M 210 112 L 260 132 L 260 174 C 260 204 238 224 210 236 C 182 224 160 204 160 174 L 160 132 Z" fill="#062c22" stroke="#34d399" stroke-width="1.5"/>

    <!-- Cadenas doré au centre du bouclier -->
    <path d="M 194 170 L 194 156 A 16 16 0 0 1 226 156 L 226 170" fill="none" stroke="url(#cyGold)" stroke-width="6" stroke-linecap="round"/>
    <rect x="184" y="168" width="52" height="40" rx="8" fill="url(#cyGold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="210" cy="184" r="5" fill="#062c22"/>
    <rect x="208" y="186" width="4" height="11" rx="2" fill="#062c22"/>
  </g>

  <!-- Glyphes binaires et pare-feu -->
  <g filter="url(#cyGlow)" font-family="monospace" font-weight="bold">
    <text x="100" y="164" fill="#34d399" font-size="13">0110</text>
    <text x="288" y="164" fill="#38bdf8" font-size="13">SHA</text>
    <text x="104" y="206" fill="#38bdf8" font-size="12">TLS</text>
    <text x="286" y="206" fill="#34d399" font-size="12">AES</text>
  </g>
</svg>

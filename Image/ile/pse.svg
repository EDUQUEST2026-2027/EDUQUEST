<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="ipseHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ipseRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="ipseRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="ipsePlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#082815"/>
    </linearGradient>
    <linearGradient id="ipseGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="ipseAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ipseBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="ipseShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <circle cx="210" cy="195" r="185" fill="url(#ipseHalo)"/>

  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#86efac" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#86efac" opacity="0.6"/>
  </g>

  <g filter="url(#ipseShadow)">
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#ipseRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#ipseRockDeep)" opacity="0.85"/>
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#86efac" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#86efac" opacity="0.75"/>

    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#ipsePlateau)" stroke="url(#ipseGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Bouclier de Prévention + Croix de Secourisme SST + Feuille Environnement -->
    <g transform="translate(210 148)">
      <ellipse cx="0" cy="80" rx="78" ry="14" fill="#091326" opacity="0.45"/>
      <path d="M0 -54 L48 -36 L48 6 C48 34 24 54 0 64 C-24 54 -48 34 -48 6 L-48 -36 Z" fill="#0f291e" stroke="url(#ipseGold)" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Croix SST verte -->
      <path d="M-8 -28 L8 -28 L8 -12 L24 -12 L24 4 L8 4 L8 20 L-8 20 L-8 4 L-24 4 L-24 -12 L-8 -12 Z" fill="url(#ipseAccent)"/>
      <!-- Feuille écologique dorée -->
      <path d="M18 32 C38 30 48 14 48 -4 C30 -2 18 10 18 32 Z" fill="#facc15"/>
    </g>

    <g transform="translate(210 336)">
      <path d="M-90 -19 L90 -19 L78 19 L-78 19 Z"
            fill="url(#ipseBanner)" stroke="url(#ipseGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-74" cy="-9" r="2.4"/>
        <circle cx="74" cy="-9" r="2.4"/>
        <circle cx="-68" cy="10" r="2.4"/>
        <circle cx="68" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="20" font-weight="700"
            fill="#f4de94" letter-spacing="2">PSE &amp; SANTÉ</text>
    </g>
  </g>

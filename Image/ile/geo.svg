<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="igeoHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="igeoRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="igeoRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="igeoPlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24583c"/>
      <stop offset="1" stop-color="#112e20"/>
    </linearGradient>
    <linearGradient id="igeoGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="igeoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="igeoBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="igeoShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#igeoHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#6ee7b7" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#6ee7b7" opacity="0.6"/>
  </g>

  <g filter="url(#igeoShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#igeoRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#igeoRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#6ee7b7" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#igeoPlateau)" stroke="url(#igeoGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Globe terrestre sur pied doré + Montagne + Rose des vents -->
      <g transform="translate(210 144)">
        <ellipse cx="0" cy="84" rx="74" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Montagne enneigée gauche -->
        <g transform="translate(-76 42)">
          <polygon points="-36,36 0,-36 36,36" fill="#485a78" stroke="#0c1830" stroke-width="2.5"/>
          <polygon points="-14,-8 0,-36 14,-8 6,-2 0,-10 -6,-2" fill="#f1f5f9"/>
        </g>
        <!-- Globe central monté sur arc d'or -->
        <path d="M-12 76 H12 M0 60 V76" stroke="url(#igeoGold)" stroke-width="7" stroke-linecap="round"/>
        <path d="M-26 78 H26" stroke="url(#igeoGold)" stroke-width="8" stroke-linecap="round"/>
        <path d="M-2 -68 A64 64 0 0 1 -2 60" fill="none" stroke="url(#igeoGold)" stroke-width="5"/>
        <circle cx="0" cy="-4" r="54" fill="#2575b8" stroke="#0c1830" stroke-width="3"/>
        <path d="M-34 -24 q18 -12 34 -2 q10 8 4 22 q-14 10 -28 4 Z" fill="#52c47a"/>
        <path d="M12 6 q18 -4 26 10 q4 16 -14 22 q-16 -2 -12 -32 Z" fill="#52c47a"/>
        <ellipse cx="0" cy="-4" rx="54" ry="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="22" ry="54" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <!-- Rose des vents droite -->
        <g transform="translate(86 -34)">
          <circle r="24" fill="#101b36" stroke="url(#igeoGold)" stroke-width="3"/>
          <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="url(#igeoGold)"/>
          <circle r="4" fill="#34d399"/>
        </g>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-91 -19 L91 -19 L79 19 L-79 19 Z"
            fill="url(#igeoBanner)" stroke="url(#igeoGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-75" cy="-9" r="2.4"/>
        <circle cx="75" cy="-9" r="2.4"/>
        <circle cx="-69" cy="10" r="2.4"/>
        <circle cx="69" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="20" font-weight="700"
            fill="#f4de94" letter-spacing="2">GÉOGRAPHIE</text>
    </g>
  </g>
</svg>

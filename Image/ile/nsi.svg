<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ============================================================
       ÎLOT « NSI & NUMÉRIQUE » — EDUQUEST
       Tours de serveurs, circuit imprimé néon, hologramme </> et cristal binaire.
       ============================================================ -->
  <defs>
    <linearGradient id="nsiRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e38"/>
      <stop offset="0.6" stop-color="#101026"/>
      <stop offset="1" stop-color="#070714"/>
    </linearGradient>
    <linearGradient id="nsiRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b6d"/>
      <stop offset="0.6" stop-color="#232347"/>
      <stop offset="1" stop-color="#14142b"/>
    </linearGradient>
    <linearGradient id="nsiPlatform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="0.2" stop-color="#0f2b48"/>
      <stop offset="1" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="nsiNeonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="nsiNeonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f857a6"/>
      <stop offset="1" stop-color="#ff5858"/>
    </linearGradient>
    <radialGradient id="nsiHalo" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#7b2cbf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="nsiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nsiShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Halo d'énergie cybernétique -->
  <circle cx="210" cy="190" r="150" fill="url(#nsiHalo)"/>

  <!-- Base flottante (rocher cybernétique sombre) -->
  <g filter="url(#nsiShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 375 295 320 345 Q 210 400 100 345 Q 45 295 75 250 Z" fill="url(#nsiRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 360 280 320 315 Q 210 370 100 315 Q 60 280 85 245 Z" fill="url(#nsiRockTop)"/>

    <!-- Pistes de circuit imprimé lumineuses gravées dans le rocher -->
    <path d="M 120 285 L 145 320 L 170 320 L 195 350" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#nsiGlow)"/>
    <circle cx="195" cy="350" r="3" fill="#00f2fe" filter="url(#nsiGlow)"/>
    <path d="M 300 285 L 275 320 L 250 320 L 225 355" stroke="#f857a6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#nsiGlow)"/>
    <circle cx="225" cy="355" r="3" fill="#f857a6" filter="url(#nsiGlow)"/>

    <!-- Plateau cybernétique hexagonal/arrondi -->
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="url(#nsiPlatform)"/>
    <ellipse cx="210" cy="242" rx="132" ry="34" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.85" filter="url(#nsiGlow)"/>
    <ellipse cx="210" cy="242" rx="90" ry="22" fill="none" stroke="#f857a6" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Datacenter / Serveur principal (Tour gauche) -->
  <g>
    <rect x="110" y="170" width="38" height="70" rx="4" fill="#141829" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="116" y1="185" x2="142" y2="185" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <line x1="116" y1="198" x2="142" y2="198" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <line x1="116" y1="211" x2="142" y2="211" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <line x1="116" y1="224" x2="142" y2="224" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <circle cx="120" cy="177" r="2" fill="#2ed573"/>
    <circle cx="126" cy="177" r="2" fill="#2ed573"/>
    <circle cx="132" cy="177" r="2" fill="#ffa502"/>
  </g>

  <!-- Datacenter secondaire (Tour droite) -->
  <g>
    <rect x="272" y="180" width="34" height="60" rx="4" fill="#141829" stroke="#f857a6" stroke-width="1.5"/>
    <line x1="278" y1="195" x2="300" y2="195" stroke="#f857a6" stroke-width="2" opacity="0.8"/>
    <line x1="278" y1="208" x2="300" y2="208" stroke="#f857a6" stroke-width="2" opacity="0.8"/>
    <line x1="278" y1="221" x2="300" y2="221" stroke="#f857a6" stroke-width="2" opacity="0.8"/>
    <circle cx="282" cy="188" r="2" fill="#2ed573"/>
    <circle cx="288" cy="188" r="2" fill="#00f2fe"/>
  </g>

  <!-- Écran hologramme central flottant </> -->
  <g filter="url(#nsiGlow)">
    <rect x="165" y="125" width="90" height="65" rx="8" fill="#0b1b33" fill-opacity="0.85" stroke="url(#nsiNeonCyan)" stroke-width="2.5"/>
    <!-- Symbole de code </> -->
    <path d="M 185 158 L 175 168 L 185 178" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 235 158 L 245 168 L 235 178" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="216" y1="152" x2="204" y2="184" stroke="#f857a6" stroke-width="3" stroke-linecap="round"/>
    <!-- Socle projecteur de l'hologramme -->
    <ellipse cx="210" cy="225" rx="24" ry="8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <polygon points="186,225 234,225 240,195 180,195" fill="url(#nsiNeonCyan)" opacity="0.15"/>
  </g>

  <!-- Particules binaires flottantes 0 & 1 -->
  <text x="140" y="140" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="bold" opacity="0.75" filter="url(#nsiGlow)">01</text>
  <text x="270" y="145" fill="#f857a6" font-family="monospace" font-size="13" font-weight="bold" opacity="0.75" filter="url(#nsiGlow)">10</text>
  <text x="200" y="105" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold" opacity="0.6">Python</text>
  <text x="120" y="270" fill="#7bed9f" font-family="monospace" font-size="11" font-weight="bold" opacity="0.8">{ ; }</text>
</svg>

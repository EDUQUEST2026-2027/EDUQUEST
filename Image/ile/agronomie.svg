<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT AGRONOMIE & ECOLOGIE (STAV) - EDUQUEST -->
  <defs>
    <linearGradient id="agRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#362511"/>
      <stop offset="0.6" stop-color="#211609"/>
      <stop offset="1" stop-color="#110b04"/>
    </linearGradient>
    <linearGradient id="agRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6212"/>
      <stop offset="0.6" stop-color="#2d4a0e"/>
      <stop offset="1" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="agLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="agHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#facc15" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="agShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <circle cx="210" cy="182" r="148" fill="url(#agHalo)"/>
  <g filter="url(#agShadow)">
    <path d="M 74 250 Q 210 276 346 250 Q 372 294 318 345 Q 210 398 102 345 Q 48 294 74 250 Z" fill="url(#agRockDeep)"/>
    <path d="M 86 244 Q 210 268 334 244 Q 356 278 318 314 Q 210 366 102 314 Q 64 278 86 244 Z" fill="url(#agRockTop)"/>
    <ellipse cx="210" cy="244" rx="138" ry="40" fill="#1e3a0a"/>
    <ellipse cx="210" cy="240" rx="126" ry="32" fill="none" stroke="#86efac" stroke-width="2.2"/>
  </g>
  <!-- Grande pousse écologique + Épi de blé doré + Goutte d'eau -->
  <g filter="url(#agShadow)">
    <path d="M 210 238 L 210 132" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <path d="M 210 180 C 158 174 134 138 148 112 C 178 112 204 138 210 180 Z" fill="url(#agLeaf)" stroke="#dcfce7" stroke-width="2.5"/>
    <path d="M 210 162 C 262 156 286 120 272 94 C 242 94 216 120 210 162 Z" fill="url(#agLeaf)" stroke="#dcfce7" stroke-width="2.5"/>
    <!-- Épi doré gauche -->
    <path d="M 134 234 L 122 162" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="116" cy="176" rx="8" ry="14" transform="rotate(-25 116 176)" fill="#fde047"/>
    <ellipse cx="132" cy="184" rx="8" ry="14" transform="rotate(20 132 184)" fill="#f59e0b"/>
    <ellipse cx="118" cy="156" rx="7" ry="12" transform="rotate(-18 118 156)" fill="#fde047"/>
    <!-- Goutte d'eau pure droite -->
    <path d="M 294 156 C 294 156 318 188 318 206 A 24 24 0 0 1 270 206 C 270 188 294 156 294 156 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2.5"/>
    <circle cx="286" cy="202" r="5" fill="#e0f2fe" opacity="0.8"/>
  </g>
</svg>
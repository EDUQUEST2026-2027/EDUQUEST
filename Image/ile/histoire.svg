<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="ihistoireHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ihistoireRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="ihistoireRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="ihistoirePlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c3a2c"/>
      <stop offset="1" stop-color="#291e17"/>
    </linearGradient>
    <linearGradient id="ihistoireGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="ihistoireAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ihistoireBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="ihistoireShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#ihistoireHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#fdba74" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#fdba74" opacity="0.6"/>
  </g>

  <g filter="url(#ihistoireShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#ihistoireRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#ihistoireRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#fdba74" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#fdba74" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#ihistoirePlateau)" stroke="url(#ihistoireGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Donjon médiéval + Sablier du Temps + Parchemin -->
      <g transform="translate(210 148)">
        <ellipse cx="0" cy="80" rx="80" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Forteresse centrale -->
        <rect x="-46" y="-20" width="92" height="90" rx="4" fill="#d6ccb8" stroke="#2c241b" stroke-width="3"/>
        <path d="M-54 -20 H-32 V-36 H-14 V-20 H14 V-36 H32 V-20 H54 V-4 H-54 Z" fill="#e5dcc9" stroke="#2c241b" stroke-width="2.5"/>
        <!-- Porte voûtée -->
        <path d="M-18 70 V32 A18 18 0 0 1 18 32 V70 Z" fill="#59321b" stroke="url(#ihistoireGold)" stroke-width="3"/>
        <!-- Tourelle + étendard -->
        <rect x="-64" y="4" width="24" height="66" fill="#bfb39c" stroke="#2c241b" stroke-width="2.5"/>
        <polygon points="-68,4 -52,-28 -36,4" fill="#9b2c2c" stroke="#2c241b" stroke-width="2.5"/>
        <line x1="-52" y1="-28" x2="-52" y2="-56" stroke="url(#ihistoireGold)" stroke-width="3"/>
        <polygon points="-52,-56 -22,-47 -52,-38" fill="url(#ihistoireAccent)"/>
        <!-- Sablier doré à droite -->
        <g transform="translate(66 26)">
          <rect x="-22" y="-36" width="44" height="7" rx="3" fill="url(#ihistoireGold)"/>
          <rect x="-22" y="30" width="44" height="7" rx="3" fill="url(#ihistoireGold)"/>
          <path d="M-16 -29 L16 -29 L3 0 L16 30 L-16 30 L-3 0 Z" fill="#38bdf8" fill-opacity="0.28" stroke="#f5de8a" stroke-width="2.5"/>
          <polygon points="-10,28 10,28 0,10" fill="#f6c445"/>
          <polygon points="-8,-18 8,-18 0,-4" fill="#f6c445"/>
        </g>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-90 -19 L90 -19 L78 19 L-78 19 Z"
            fill="url(#ihistoireBanner)" stroke="url(#ihistoireGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-74" cy="-9" r="2.4"/>
        <circle cx="74" cy="-9" r="2.4"/>
        <circle cx="-68" cy="10" r="2.4"/>
        <circle cx="68" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="700"
            fill="#f4de94" letter-spacing="2">HISTOIRE</text>
    </g>
  </g>
</svg>

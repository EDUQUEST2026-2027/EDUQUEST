<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT STSS SANTE ET SOCIAL ST2S - EDUQUEST -->
  <defs>
    <linearGradient id="stRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.6" stop-color="#0b2e2c"/>
      <stop offset="1" stop-color="#051716"/>
    </linearGradient>
    <linearGradient id="stRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a73"/>
      <stop offset="0.6" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0a2e2c"/>
    </linearGradient>
    <linearGradient id="stHeart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff758f"/>
      <stop offset="0.55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="stHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#fb7185" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="stShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="stGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#stHalo)"/>

  <!-- Base rocheuse flottante -->
  <g filter="url(#stShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#stRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#stRockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="#0f766e"/>
    <ellipse cx="210" cy="242" rx="128" ry="33" fill="#5eead4" fill-opacity="0.25"/>
  </g>

  <!-- Cœur médical central avec tracé ECG -->
  <g filter="url(#stShadow)">
    <path d="M 210 232 C 210 232 134 192 134 146 C 134 120 156 104 180 104 C 195 104 205 112 210 122 C 215 112 225 104 240 104 C 264 104 286 120 286 146 C 286 192 210 232 210 232 Z" fill="url(#stHeart)" stroke="#fecdd3" stroke-width="2.5"/>
    <!-- Ligne ECG lumineuse -->
    <path d="M 148 164 L 180 164 L 192 138 L 204 188 L 218 148 L 228 164 L 272 164" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#stGlow)"/>
  </g>

  <!-- Croix médicale lumineuse à gauche -->
  <g transform="translate(114, 206)" filter="url(#stShadow)">
    <circle cx="0" cy="0" r="22" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2.5"/>
    <rect x="-5" y="-13" width="10" height="26" rx="2" fill="#0d9488"/>
    <rect x="-13" y="-5" width="26" height="10" rx="2" fill="#0d9488"/>
  </g>

  <!-- Silhouettes solidaires (Action sociale) à droite -->
  <g transform="translate(300, 210)" filter="url(#stShadow)">
    <circle cx="0" cy="0" r="22" fill="#134e4a" stroke="#5eead4" stroke-width="2.5"/>
    <circle cx="-6" cy="-5" r="4.5" fill="#fef08a"/>
    <circle cx="6" cy="-5" r="4.5" fill="#5eead4"/>
    <path d="M -13 10 Q -6 2 0 10 Q 6 2 13 10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>


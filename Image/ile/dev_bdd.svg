      <stop offset="0" stop-color="#0c2642"/>
      <stop offset="0.6" stop-color="#071628"/>
      <stop offset="1" stop-color="#030a14"/>
    </linearGradient>
    <linearGradient id="dbRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="0.6" stop-color="#0e3447"/>
      <stop offset="1" stop-color="#081e2c"/>
    </linearGradient>
    <linearGradient id="dbCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="dbHalo" cx="0.5" cy="0.4" r="0.6">

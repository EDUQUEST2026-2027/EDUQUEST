    </filter>
  </defs>
  <circle cx="210" cy="182" r="148" fill="url(#dbHalo)"/>
  <g filter="url(#dbShadow)">
    <path d="M 74 250 Q 210 276 346 250 Q 372 294 318 345 Q 210 398 102 345 Q 48 294 74 250 Z" fill="url(#dbRockDeep)"/>
    <path d="M 86 244 Q 210 268 334 244 Q 356 278 318 314 Q 210 366 102 314 Q 64 278 86 244 Z" fill="url(#dbRockTop)"/>
    <ellipse cx="210" cy="244" rx="138" ry="40" fill="#082032"/>
    <ellipse cx="210" cy="240" rx="126" ry="32" fill="none" stroke="#22d3ee" stroke-width="2.2"/>
  </g>
  <!-- Cylindre Base de Données SQL + Fenêtre de Code -->
  <g filter="url(#dbShadow)">
    <path d="M 122 140 L 122 218 A 48 16 0 0 0 218 218 L 218 140 Z" fill="url(#dbCyl)" stroke="#bae6fd" stroke-width="2.5"/>
    <ellipse cx="170" cy="140" rx="48" ry="16" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="2.5"/>

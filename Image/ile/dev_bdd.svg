    <rect x="206" y="116" width="110" height="100" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="222" cy="130" r="4" fill="#f43f5e"/>
    <circle cx="235" cy="130" r="4" fill="#facc15"/>
    <circle cx="248" cy="130" r="4" fill="#4ade80"/>
    <text x="220" y="160" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">SELECT *</text>

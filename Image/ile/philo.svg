<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="iphiloHalo" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iphiloRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e68"/>
      <stop offset="0.55" stop-color="#192544"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="iphiloRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="iphiloPlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e3552"/>
      <stop offset="1" stop-color="#211a30"/>
    </linearGradient>
    <linearGradient id="iphiloGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e29c"/>
      <stop offset="0.5" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8b661d"/>
    </linearGradient>
    <linearGradient id="iphiloAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iphiloBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#0c1328"/>
    </linearGradient>
    <filter id="iphiloShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- Halo astral unifié -->
  <circle cx="210" cy="195" r="185" fill="url(#iphiloHalo)"/>

  <!-- Étoiles astrales dorées (grille signature EDUQUEST) -->
  <g fill="#f2dc96">
    <path d="M52 94 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" opacity="0.88"/>
    <path d="M368 72 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" opacity="0.72"/>
    <path d="M382 174 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity="0.55"/>
    <circle cx="64" cy="210" r="2.4" fill="#fde68a" opacity="0.65"/>
    <circle cx="352" cy="264" r="2.6" opacity="0.5"/>
    <circle cx="320" cy="44" r="2" fill="#fde68a" opacity="0.6"/>
  </g>

  <g filter="url(#iphiloShadow)">
    <!-- Socle rocheux flottant unifié -->
    <path d="M34 232 L210 264 L386 232 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 L68 284 Z" fill="url(#iphiloRockTop)" stroke="#080e1d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 284 L132 300 L210 308 L288 300 L352 284 L314 328 L272 362 L210 384 L148 362 L106 328 Z" fill="url(#iphiloRockDeep)" opacity="0.85"/>
    <!-- Veines cristallines de la matière -->
    <path d="M120 296 L142 324 M296 296 L278 326 M192 318 L210 356 L228 318" stroke="#fde68a" stroke-width="2.4" stroke-linecap="round" opacity="0.5" fill="none"/>
    <!-- Galets flottants sous l'île -->
    <polygon points="164,376 175,382 169,394 157,388" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <polygon points="256,374 268,382 260,393 249,386" fill="#1b294c" stroke="#c8a84b" stroke-width="1.2"/>
    <circle cx="210" cy="400" r="4" fill="#fde68a" opacity="0.75"/>

    <!-- Plateau insulaire cerclé d'or -->
    <ellipse cx="210" cy="236" rx="176" ry="54" fill="url(#iphiloPlateau)" stroke="url(#iphiloGold)" stroke-width="3.5"/>
    <ellipse cx="210" cy="232" rx="158" ry="43" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Scène dédiée à la matière -->
    
      <!-- Temple grec + Chouette d'Athéna + Flamme de Vérité -->
      <g transform="translate(210 148)">
        <ellipse cx="0" cy="80" rx="82" ry="14" fill="#091326" opacity="0.45"/>
        <!-- Temple marbre -->
        <rect x="-66" y="52" width="132" height="14" rx="2" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
        <rect x="-52" y="-12" width="13" height="64" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
        <rect x="-18" y="-12" width="13" height="64" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
        <rect x="5" y="-12" width="13" height="64" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
        <rect x="39" y="-12" width="13" height="64" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
        <polygon points="-74,-12 0,-58 74,-12" fill="#f8fafc" stroke="url(#iphiloGold)" stroke-width="3.5"/>
        <circle cx="0" cy="-28" r="9" fill="url(#iphiloGold)"/>
        <!-- Chouette d'Athéna droite -->
        <g transform="translate(66 36)">
          <ellipse cx="0" cy="14" rx="16" ry="20" fill="#6d597a" stroke="#0c1830" stroke-width="2"/>
          <circle cx="0" cy="-6" r="14" fill="#826c92" stroke="#0c1830" stroke-width="2"/>
          <circle cx="-5" cy="-6" r="4.5" fill="#fde047"/><circle cx="5" cy="-6" r="4.5" fill="#fde047"/>
          <circle cx="-5" cy="-6" r="2" fill="#0f172a"/><circle cx="5" cy="-6" r="2" fill="#0f172a"/>
          <polygon points="0,-2 -3,4 3,4" fill="#f97316"/>
        </g>
        <!-- Flamme centrale -->
        <path d="M0 -8 C-14 14 -8 34 0 38 C8 34 14 14 0 -8 Z" fill="url(#iphiloAccent)"/>
      </g>

    <!-- Bannière astrale dorée unifiée -->
    <g transform="translate(210 336)">
      <path d="M-94 -19 L94 -19 L82 19 L-82 19 Z"
            fill="url(#iphiloBanner)" stroke="url(#iphiloGold)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#f5de8a">
        <circle cx="-78" cy="-9" r="2.4"/>
        <circle cx="78" cy="-9" r="2.4"/>
        <circle cx="-72" cy="10" r="2.4"/>
        <circle cx="72" cy="10" r="2.4"/>
      </g>
      <text x="0" y="7" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="19" font-weight="700"
            fill="#f4de94" letter-spacing="2">PHILOSOPHIE</text>
    </g>
  </g>
</svg>

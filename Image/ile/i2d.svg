<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT I2D INNOVATION ET DEVELOPPEMENT DURABLE - EDUQUEST -->
  <defs>
    <linearGradient id="i2RockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4332"/>
      <stop offset="0.6" stop-color="#0d2818"/>
      <stop offset="1" stop-color="#05140b"/>
    </linearGradient>
    <linearGradient id="i2RockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6a4f"/>
      <stop offset="0.6" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="i2Grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52b788"/>
      <stop offset="0.6" stop-color="#2d6a4f"/>
      <stop offset="1" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="i2Solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="i2Halo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="i2Shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="i2Glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#i2Halo)"/>

  <!-- Base rocheuse verdoyante -->
  <g filter="url(#i2Shadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#i2RockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#i2RockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="url(#i2Grass)"/>
    <ellipse cx="210" cy="242" rx="126" ry="32" fill="#95d5b2" fill-opacity="0.28"/>
  </g>

  <!-- Éolienne centrale -->
  <g filter="url(#i2Shadow)">
    <polygon points="154,242 166,242 162,134 158,134" fill="#f1f5f9"/>
    <g transform="translate(160, 134)">
      <path d="M 0 0 L -5 -58 Q 0 -64 6 -56 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 0 0 L -5 -58 Q 0 -64 6 -56 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" transform="rotate(120)"/>
      <path d="M 0 0 L -5 -58 Q 0 -64 6 -56 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" transform="rotate(240)"/>
      <circle cx="0" cy="0" r="8" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
    </g>
  </g>

  <!-- Panneau solaire photovoltaïque à droite -->
  <g filter="url(#i2Shadow)">
    <rect x="242" y="218" width="10" height="24" fill="#94a3b8"/>
    <polygon points="208,216 284,216 300,174 224,174" fill="url(#i2Solar)" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="234" y1="174" x2="218" y2="216" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
    <line x1="258" y1="174" x2="242" y2="216" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
    <line x1="280" y1="174" x2="264" y2="216" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
    <line x1="216" y1="195" x2="292" y2="195" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Feuille éco-conception lumineuse -->
  <g transform="translate(274, 118)" filter="url(#i2Glow)">
    <path d="M -18 16 C -22 -14 4 -28 24 -22 C 26 2 8 24 -18 16 Z" fill="#4ade80" stroke="#dcfce7" stroke-width="2"/>
    <path d="M -18 16 Q 0 0 18 -14" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Écusson énergie verte -->
  <g filter="url(#i2Glow)">
    <text x="108" y="220" fill="#fef08a" font-family="sans-serif" font-size="13" font-weight="bold">ACV</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT ELECTRONIQUE ET SYSTEMES - EDUQUEST -->
  <defs>
    <linearGradient id="elRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143627"/>
      <stop offset="0.6" stop-color="#091f15"/>
      <stop offset="1" stop-color="#040f0a"/>
    </linearGradient>
    <linearGradient id="elRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#225e42"/>
      <stop offset="0.6" stop-color="#133d29"/>
      <stop offset="1" stop-color="#082115"/>
    </linearGradient>
    <linearGradient id="elCopper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="elLed" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.6" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="elHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="elShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="elGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#elHalo)"/>

  <g filter="url(#elShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#elRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#elRockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="#065f46"/>
    <ellipse cx="210" cy="242" rx="130" ry="34" fill="none" stroke="url(#elCopper)" stroke-width="2.2"/>
    <path d="M 110 242 L 145 242 L 160 228 L 260 228 L 275 242 L 310 242" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.85"/>
    <circle cx="110" cy="242" r="4" fill="#fbbf24"/>
    <circle cx="310" cy="242" r="4" fill="#fbbf24"/>
  </g>

  <g filter="url(#elShadow)">
    <line x1="156" y1="200" x2="156" y2="236" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="176" y1="200" x2="176" y2="236" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M 140 200 L 140 162 A 26 26 0 0 1 192 162 L 192 200 Z" fill="url(#elLed)" stroke="#fef08a" stroke-width="2" filter="url(#elGlow)"/>
    <rect x="135" y="196" width="62" height="9" rx="4" fill="#ea580c"/>
  </g>

  <g transform="translate(262, 184) rotate(-18)" filter="url(#elShadow)">
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#e2e8f0" stroke-width="4"/>
    <rect x="-32" y="-14" width="64" height="28" rx="9" fill="#f3d5a5" stroke="#92400e" stroke-width="2"/>
    <rect x="-20" y="-14" width="7" height="28" fill="#dc2626"/>
    <rect x="-6" y="-14" width="7" height="28" fill="#dc2626"/>
    <rect x="8" y="-14" width="7" height="28" fill="#78350f"/>
    <rect x="20" y="-14" width="5" height="28" fill="#eab308"/>
  </g>

  <g filter="url(#elGlow)">
    <polygon points="222,92 198,132 214,132 204,164 234,122 216,122" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <text x="210" y="256" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold">U = R · I</text>

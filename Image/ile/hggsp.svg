<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- ILOT HGGSP GEOPOLITIQUE - EDUQUEST -->
  <defs>
    <linearGradient id="hgRockDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172a4a"/>
      <stop offset="0.6" stop-color="#0d182e"/>
      <stop offset="1" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="hgRockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f85"/>
      <stop offset="0.6" stop-color="#1a3159"/>
      <stop offset="1" stop-color="#0e1b33"/>
    </linearGradient>
    <radialGradient id="hgGlobe" cx="0.35" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#60d5ff"/>
      <stop offset="0.55" stop-color="#1d6fa5"/>
      <stop offset="1" stop-color="#0a2540"/>
    </radialGradient>
    <linearGradient id="hgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.55" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="hgHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e9c46a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="hgShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="hgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="210" cy="182" r="150" fill="url(#hgHalo)"/>

  <!-- Base rocheuse flottante -->
  <g filter="url(#hgShadow)">
    <path d="M 75 250 Q 210 275 345 250 Q 372 294 320 344 Q 210 398 100 344 Q 48 294 75 250 Z" fill="url(#hgRockDeep)"/>
    <path d="M 85 245 Q 210 268 335 245 Q 358 278 320 314 Q 210 368 100 314 Q 62 278 85 245 Z" fill="url(#hgRockTop)"/>
    <ellipse cx="210" cy="245" rx="140" ry="42" fill="#13294b"/>
    <ellipse cx="210" cy="242" rx="128" ry="33" fill="none" stroke="#e9c46a" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Globe géopolitique sur pied doré -->
  <g filter="url(#hgShadow)">
    <!-- Socle -->
    <ellipse cx="210" cy="242" rx="44" ry="12" fill="url(#hgGold)"/>
    <rect x="204" y="218" width="12" height="24" fill="url(#hgGold)"/>
    <!-- Arc méridien doré -->
    <path d="M 150 118 A 72 72 0 1 1 258 214" fill="none" stroke="url(#hgGold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Sphère -->
    <circle cx="210" cy="160" r="58" fill="url(#hgGlobe)" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Continents stylisés -->
    <path d="M 176 136 Q 194 126 212 134 Q 222 144 214 156 Q 202 162 190 156 Q 174 150 176 136 Z" fill="#4ade80" opacity="0.82"/>
    <path d="M 218 148 Q 242 140 254 156 Q 250 176 232 184 Q 218 176 218 148 Z" fill="#4ade80" opacity="0.82"/>
    <path d="M 172 172 Q 186 168 196 184 Q 190 202 178 198 Q 168 188 172 172 Z" fill="#4ade80" opacity="0.82"/>
    <!-- Méridiens et parallèles -->
    <ellipse cx="210" cy="160" rx="28" ry="58" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.55"/>
    <line x1="152" y1="160" x2="268" y2="160" stroke="#bae6fd" stroke-width="1.2" opacity="0.55"/>
    <ellipse cx="210" cy="160" rx="58" ry="20" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- Arcs de flux géopolitiques -->
  <g filter="url(#hgGlow)">
    <path d="M 118 228 Q 150 130 210 102" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M 302 228 Q 270 130 210 102" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 5"/>
    <circle cx="118" cy="228" r="6" fill="#ffd166"/>
    <circle cx="302" cy="228" r="6" fill="#38bdf8"/>
    <circle cx="210" cy="102" r="5" fill="#fff"/>
  </g>

  <!-- Rose des vents (coin gauche) -->
  <g transform="translate(114, 152)" filter="url(#hgGlow)">
    <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="url(#hgGold)"/>
    <circle cx="0" cy="0" r="4" fill="#0d182e"/>
  </g>
</svg>

